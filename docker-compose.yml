version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: safety_compliance_api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
    environment:
      - TF_CPP_MIN_LOG_LEVEL=2
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: safety_compliance_frontend
    command: streamlit run streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models
    environment:
      - TF_CPP_MIN_LOG_LEVEL=2
    depends_on:
      - api
    restart: unless-stopped
